description = 'Fineract MIX Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// OSGi implementation bundle (ADR-022). Domain residual export for provider JdbcConfig scan.
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract MIX Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.mix.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'MIX/XBRL taxonomy mapping & report implementation (JPA, REST, Spring)',
                'Import-Package': 'org.apache.fineract.mix.moduleapi,'
                        + 'org.apache.fineract.mix.service,'
                        + 'org.apache.fineract.mix.data,'
                        + 'org.apache.fineract.mix.exception,'
                        + 'org.apache.fineract.mix.command,'
                        + '*',
                // provider JdbcConfig scans mix.domain; white-box tests use Builder/impls.
                'Export-Package': 'org.apache.fineract.mix.impl.osgi',
                'Automatic-Module-Name': 'org.apache.fineract.mix.impl'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-mix/impl/bin/main")
}
