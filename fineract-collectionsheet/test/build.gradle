description = 'Fineract Collection Sheet test fragment'

apply plugin: 'java'
apply plugin: 'eclipse'
apply from: 'dependencies.gradle'

jar {
    from sourceSets.test.output
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-SymbolicName': 'org.apache.fineract.collectionsheet.test',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Fragment-Host': 'org.apache.fineract.collectionsheet.impl',
                'Automatic-Module-Name': 'org.apache.fineract.collectionsheet.test'
                )
    }
}
tasks.named('test').configure { useJUnitPlatform() }
tasks.named('jar').configure { dependsOn tasks.named('testClasses') }
