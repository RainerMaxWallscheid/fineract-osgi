dependencies {
    // testCompile dependencies are ONLY used in src/test, not src/main.
    // Do NOT repeat dependencies which are ALREADY in implementation or runtimeOnly!
    //
    tomcat 'org.apache.tomcat:tomcat:10.1.55@zip'
    def providerMainOutput = project(':fineract-provider').extensions.getByType(SourceSetContainer).named('main').get().output
    testImplementation( providerMainOutput,
            project(path: ':fineract-core', configuration: 'runtimeElements'),
            project(path: ':fineract-accounting-api', configuration: 'runtimeElements'),
            project(path: ':fineract-accounting-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-investor-api', configuration: 'runtimeElements'),
            project(path: ':fineract-investor-impl', configuration: 'runtimeElements'),
            // Charge catalog runtime (explicit api + impl; façade deprecated).
            project(path: ':fineract-charge-api', configuration: 'runtimeElements'),
            project(path: ':fineract-charge-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-rates-api', configuration: 'runtimeElements'),
            project(path: ':fineract-rates-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-tax-api', configuration: 'runtimeElements'),
            project(path: ':fineract-tax-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-loan-api', configuration: 'runtimeElements'),
            project(path: ':fineract-loan-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-savings-api', configuration: 'runtimeElements'),
            project(path: ':fineract-savings-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-provider', configuration: 'runtimeElements'),
            project(path: ':fineract-avro-schemas', configuration: 'runtimeElements'),
            project(path: ':fineract-progressive-loan-api', configuration: 'runtimeElements'),
            project(path: ':fineract-progressive-loan-impl', configuration: 'runtimeElements'),
            // Working-capital-loan: needed on test JVM for WC product builders / enums (not only cargo WAR).
            project(path: ':fineract-working-capital-loan-api', configuration: 'runtimeElements'),
            project(path: ':fineract-working-capital-loan-impl', configuration: 'runtimeElements'),
            // Peel-era types used directly by ITs (ShareAccountStatusType is in core;
            // ExternalEventResponse in event-impl; TrapDoor uses configuration-impl)
            project(path: ':fineract-shares-api', configuration: 'runtimeElements'),
            project(path: ':fineract-event-api', configuration: 'runtimeElements'),
            project(path: ':fineract-event-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-configuration-api', configuration: 'runtimeElements'),
            project(path: ':fineract-configuration-impl', configuration: 'runtimeElements'),
            project(path: ':fineract-note-api', configuration: 'runtimeElements')
            )

    // Retrofit client for existing tests
    testImplementation project(path: ':fineract-client', configuration: 'runtimeElements')

    // Feign client - exclude fineract-client module to avoid Retrofit/Feign model conflicts
    // Both generated and hand-written Feign services are available in feign.services package
    testImplementation(project(path: ':fineract-client-feign', configuration: 'runtimeElements')) {
        exclude group: 'org.apache.fineract', module: 'fineract-client'
    }
    testImplementation ('org.mock-server:mockserver-junit-jupiter') {
        exclude group: 'com.sun.mail', module: 'mailapi'
        exclude group: 'javax.servlet', module: 'javax.servlet-api'
        exclude group: 'javax.validation'
    }
    testImplementation ('io.rest-assured:rest-assured') {
        exclude group: 'commons-logging'
        exclude group: 'org.apache.sling'
        exclude group: 'com.sun.xml.bind'
    }
    testImplementation 'org.apache.groovy:groovy-xml'
    testImplementation 'org.apache.groovy:groovy-json'
    testImplementation 'org.awaitility:awaitility'

    testCompileOnly 'com.github.spotbugs:spotbugs-annotations'
    testImplementation 'org.assertj:assertj-core'

    testImplementation 'org.mapstruct:mapstruct'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor'

    testImplementation 'org.wiremock:wiremock-standalone'
    testImplementation 'com.google.guava:guava'
    testImplementation 'com.github.romankh3:image-comparison'
}
