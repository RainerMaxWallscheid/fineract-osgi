description = 'Fineract Accounting API (OSGi interface bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

// OSGi interface bundle (ADR-022 / accounting plan). No Spring / JPA / REST entities on api.
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Accounting API',
                'Bundle-SymbolicName': 'org.apache.fineract.accounting.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Accounting contracts (ports, DTOs, exceptions, pure constants)',
                'Export-Package': 'org.apache.fineract.accounting.moduleapi,'
                        + 'org.apache.fineract.accounting.common,'
                        + 'org.apache.fineract.accounting.accrual.api,'
                        + 'org.apache.fineract.accounting.accrual.request,'
                        + 'org.apache.fineract.accounting.accrual.service,'
                        + 'org.apache.fineract.accounting.closure.api,'
                        + 'org.apache.fineract.accounting.closure.command,'
                        + 'org.apache.fineract.accounting.closure.data,'
                        + 'org.apache.fineract.accounting.closure.data.request,'
                        + 'org.apache.fineract.accounting.closure.exception,'
                        + 'org.apache.fineract.accounting.closure.service,'
                        + 'org.apache.fineract.accounting.financialactivityaccount.api,'
                        + 'org.apache.fineract.accounting.financialactivityaccount.data,'
                        + 'org.apache.fineract.accounting.financialactivityaccount.data.request,'
                        + 'org.apache.fineract.accounting.financialactivityaccount.exception,'
                        + 'org.apache.fineract.accounting.financialactivityaccount.service,'
                        + 'org.apache.fineract.accounting.glaccount.command,'
                        + 'org.apache.fineract.accounting.glaccount.data,'
                        + 'org.apache.fineract.accounting.glaccount.exception,'
                        + 'org.apache.fineract.accounting.glaccount.service,'
                        + 'org.apache.fineract.accounting.journalentry.api,'
                        + 'org.apache.fineract.accounting.journalentry.command,'
                        + 'org.apache.fineract.accounting.journalentry.data,'
                        + 'org.apache.fineract.accounting.journalentry.exception,'
                        + 'org.apache.fineract.accounting.journalentry.service,'
                        + 'org.apache.fineract.accounting.producttoaccountmapping.exception,'
                        + 'org.apache.fineract.accounting.producttoaccountmapping.service,'
                        + 'org.apache.fineract.accounting.provisioning.constant,'
                        + 'org.apache.fineract.accounting.provisioning.data,'
                        + 'org.apache.fineract.accounting.provisioning.data.request,'
                        + 'org.apache.fineract.accounting.provisioning.exception,'
                        + 'org.apache.fineract.accounting.provisioning.service,'
                        + 'org.apache.fineract.accounting.rule.api,'
                        + 'org.apache.fineract.accounting.rule.data,'
                        + 'org.apache.fineract.accounting.rule.data.request,'
                        + 'org.apache.fineract.accounting.rule.exception,'
                        + 'org.apache.fineract.accounting.rule.service,'
                        + 'org.apache.fineract.accounting.trialbalance.exception',
                'Import-Package': 'org.apache.fineract.accounting.glaccount.api,'
                        + 'org.apache.fineract.accounting.glaccount.domain,'
                        + 'org.apache.fineract.accounting.producttoaccountmapping.data,'
                        + 'org.apache.fineract.infrastructure.codes.data,'
                        + 'org.apache.fineract.infrastructure.core.api,'
                        + 'org.apache.fineract.infrastructure.core.data,'
                        + 'org.apache.fineract.infrastructure.core.exception,'
                        + 'org.apache.fineract.infrastructure.core.service,'
                        + 'org.apache.fineract.organisation.monetary.data,'
                        + 'org.apache.fineract.organisation.office.data,'
                        + 'org.apache.fineract.portfolio,'
                        + 'org.apache.fineract.portfolio.note.data,'
                        + 'org.apache.fineract.portfolio.paymentdetail.data,'
                        + 'org.apache.fineract.portfolio.savings,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.accounting.api'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-accounting/api/bin/main")
}
