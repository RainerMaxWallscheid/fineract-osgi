description = 'Fineract Accounting Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

compileJava {
    dependsOn ':fineract-avro-schemas:buildJavaSdk'
    dependsOn ':fineract-accounting-api:jar'
}

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// Residual exports for domain modules that still reference entities / helpers.
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Accounting Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.accounting.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Accounting implementation (JPA, REST, product mapping helpers, jobs)',
                'Service-Component': 'OSGI-INF/accounting.xml',
                'Require-Capability': 'osgi.extender;filter:="(&(osgi.extender=osgi.component)(version>=1.3.0)(!(version>=2.0.0)))"',
                'Import-Package': 'org.apache.fineract.accounting.closure.service,'
                        + 'org.apache.fineract.accounting.closure.data,'
                        + 'org.apache.fineract.accounting.closure.exception,'
                        + 'org.apache.fineract.portfolio.savings.moduleapi,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.accounting.impl'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-accounting/impl/bin/main")
}

eclipse {
    project {
        buildCommand([ LaunchConfigHandle: "<project>/.externalToolBuilders/OpenJPA Enhance Builder.launch" ],  'org.eclipse.ui.externaltools.ExternalToolBuilder')
    }
}
