description = 'Fineract Charge API (OSGi interface bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

// OSGi interface bundle: export contract packages only (ADR-022 / charge plan Step 4).
// Note: Export-Package includes pure enums under …charge.domain and catalog exceptions.
// The JPA Charge aggregate stays in charge-impl under the same Java package name (split-package
// debt for strict Equinox; Boot flat classpath is fine). Prefer moduleapi for foreign BCs.
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Charge API',
                'Bundle-SymbolicName': 'org.apache.fineract.charge.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Charge Catalog contracts (Module API ports, pure enums, catalog exceptions)',
                'Export-Package': 'org.apache.fineract.portfolio.charge.moduleapi,'
                        + 'org.apache.fineract.portfolio.charge.domain,'
                        + 'org.apache.fineract.portfolio.charge.exception,'
                        + 'org.apache.fineract.portfolio.charge.service',
                // Kernel exception bases only; wildcard leaves transitive resolution to the framework.
                'Import-Package': '*',
                'Automatic-Module-Name': 'org.apache.fineract.charge.api'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-charge/api/bin/main")
}
