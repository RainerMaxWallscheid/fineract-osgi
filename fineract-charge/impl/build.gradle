description = 'Fineract Charge Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

compileJava {
    dependsOn ':fineract-avro-schemas:buildJavaSdk'
}

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// OSGi implementation bundle (ADR-022 / charge plan Step 4).
// Do not export domain / service packages — other BCs use charge-api + Service Registry.
// Export the registrar package only (Spring Boot does not need OSGi Export-Package).
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Charge Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.charge.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Charge Catalog implementation (JPA, services, REST, Spring wiring)',
                'Service-Component': 'OSGI-INF/charge.xml',
                'Import-Package': 'org.osgi.framework,'
                        + 'org.apache.fineract.portfolio.charge.moduleapi,'
                        + 'org.apache.fineract.portfolio.charge.exception,'
                        + '*',
                'Export-Package': 'org.apache.fineract.portfolio.charge.impl.osgi',
                'Automatic-Module-Name': 'org.apache.fineract.charge.impl'
                )
    }
}

modernizer {
    ignoreClassNamePatterns = [
        '.*AbstractPersistableCustom',
        '.*EntityTables',
        '.*domain.*'
    ]
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-charge/impl/bin/main")
}

eclipse {
    project {
        buildCommand([ LaunchConfigHandle: "<project>/.externalToolBuilders/OpenJPA Enhance Builder.launch" ],  'org.eclipse.ui.externaltools.ExternalToolBuilder')
    }
}

// Production-only: white-box tests live in :fineract-charge-test (Fragment-Host).
