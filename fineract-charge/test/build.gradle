description = 'Fineract Charge - Unit/white-box test fragment (host: charge.impl)'

apply plugin: 'java'
apply plugin: 'eclipse'

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// OSGi fragment attached to charge-impl (ADR-022).
jar {
    from sourceSets.test.output
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Charge Test Fragment',
                'Bundle-SymbolicName': 'org.apache.fineract.charge.test',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Fragment-Host': 'org.apache.fineract.charge.impl',
                'Automatic-Module-Name': 'org.apache.fineract.charge.test'
                )
    }
}

modernizer {
    ignoreClassNamePatterns = [
        '.*AbstractPersistableCustom',
        '.*EntityTables',
        '.*domain.*'
    ]
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.test.java.outputDir = new File(rootProject.projectDir, "fineract-charge/test/bin/test")
}

tasks.named('test').configure {
    useJUnitPlatform()
}

tasks.named('jar').configure {
    dependsOn tasks.named('testClasses')
}
