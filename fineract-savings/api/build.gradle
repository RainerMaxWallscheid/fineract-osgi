description = 'Fineract Savings API (OSGi interface bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Savings API',
                'Bundle-SymbolicName': 'org.apache.fineract.savings.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Savings/deposit contracts (ports, DTOs, exceptions)',
                'Export-Package': 'org.apache.fineract.portfolio.accountdetails.data,org.apache.fineract.portfolio.interestratechart.data,org.apache.fineract.portfolio.interestratechart.exception,org.apache.fineract.portfolio.savings,org.apache.fineract.portfolio.savings.data,org.apache.fineract.portfolio.savings.exception,org.apache.fineract.portfolio.savings.moduleapi,org.apache.fineract.portfolio.savings.service,org.apache.fineract.portfolio.savings.service.search',
                'Import-Package': 'org.apache.fineract.accounting.common,'
                        + 'org.apache.fineract.accounting.glaccount.data,'
                        + 'org.apache.fineract.accounting.producttoaccountmapping.data,'
                        + 'org.apache.fineract.infrastructure.codes.data,'
                        + 'org.apache.fineract.infrastructure.core.api,'
                        + 'org.apache.fineract.infrastructure.core.data,'
                        + 'org.apache.fineract.infrastructure.core.domain,'
                        + 'org.apache.fineract.infrastructure.core.exception,'
                        + 'org.apache.fineract.infrastructure.core.service,'
                        + 'org.apache.fineract.organisation.monetary.data,'
                        + 'org.apache.fineract.organisation.staff.data,'
                        + 'org.apache.fineract.portfolio.account.data,'
                        + 'org.apache.fineract.portfolio.calendar.domain,'
                        + 'org.apache.fineract.portfolio.calendar.service,'
                        + 'org.apache.fineract.portfolio.charge.data,'
                        + 'org.apache.fineract.portfolio.common.domain,'
                        + 'org.apache.fineract.portfolio.paymentdetail.domain,'
                        + 'org.apache.fineract.portfolio.paymenttype.data,'
                        + 'org.apache.fineract.portfolio.search.data,'
                        + 'org.apache.fineract.portfolio.tax.data,'
                        + 'org.apache.fineract.useradministration.domain,'
                        + 'org.apache.fineract.interoperation.data,'
                        + 'org.apache.fineract.interoperation.domain,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.savings.api'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-savings/api/bin/main")
}
