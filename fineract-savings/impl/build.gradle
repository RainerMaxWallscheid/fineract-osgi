description = 'Fineract Savings Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

compileJava {
    dependsOn ':fineract-avro-schemas:buildJavaSdk'
    dependsOn ':fineract-savings-api:jar'
}

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// Residual exports for provider composition root (entities + entity-typed services).
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Savings Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.savings.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Savings/deposit implementation (JPA, services, COB steps)',
                'Service-Component': 'OSGI-INF/savings.xml',
                'Import-Package': 'org.apache.fineract.portfolio.savings.service,'
                        + 'org.apache.fineract.infrastructure.core.data,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.savings.impl'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-savings/impl/bin/main")
}

eclipse {
    project {
        buildCommand([ LaunchConfigHandle: "<project>/.externalToolBuilders/OpenJPA Enhance Builder.launch" ],  'org.eclipse.ui.externaltools.ExternalToolBuilder')
    }
}
