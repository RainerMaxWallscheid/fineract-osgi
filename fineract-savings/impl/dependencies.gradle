dependencies {
    api project(path: ':fineract-savings-api')

    implementation(project(path: ':fineract-core'))
    // Payment detail write port (entity residual in core)
    implementation(project(path: ':fineract-paymentdetail-api'))
    // Bulk import ports/DTOs on savings/FD/RD REST
    implementation(project(path: ':fineract-bulkimport-api'))
    // Client pure ports/DTOs (entity residual stays in core)
    implementation(project(path: ':fineract-clients-api'))
    // Group/center ports and pure service types
    implementation(project(path: ':fineract-group-api'))
    // Share product/account ports and pure DTOs
    implementation(project(path: ':fineract-shares-api'))
    // Account transfer / SI ports and shared DTOs
    implementation(project(path: ':fineract-accounttransfer-api'))
    // Chart REST + command handlers
    implementation(project(path: ':fineract-command-api'))
    // Interop domain enums live in interoperation-api; entity residual in savings-impl
    implementation(project(path: ':fineract-interoperation-api'))
    implementation(project(path: ':fineract-cob-api'))
    implementation(project(path: ':fineract-accounting-api'))
    implementation(project(path: ':fineract-accounting-impl'))
    implementation(project(path: ':fineract-charge-api'))
    // Leftover ShareAccountNoteSupportImpl
    implementation(project(path: ':fineract-note-api'))
    implementation(project(path: ':fineract-rates-api'))
    implementation(project(path: ':fineract-tax-api'))
    // Product REST templates use CurrencyReadPlatformService
    implementation(project(path: ':fineract-monetary-api'))
    // Office-scoped product SQL clauses for leftover product read
    implementation(project(path: ':fineract-entityaccess-api'))
    // Deposit account read templates use CalendarReadPlatformService
    implementation(project(path: ':fineract-calendar-api'))
    // Staff lookup for deposit account templates
    implementation(project(path: ':fineract-organisation-api'))
    // Thin EntityDatatableTemplatesReadService for savings account templates
    implementation(project(path: ':fineract-dataqueries-api'))

    implementation(
            'org.springframework.boot:spring-boot-starter-web',
            'org.springframework.boot:spring-boot-starter-security',
            'org.springframework.boot:spring-boot-starter-batch',
            'org.springframework.batch:spring-batch-integration',
            'jakarta.ws.rs:jakarta.ws.rs-api',
            'org.glassfish.jersey.media:jersey-media-multipart',

            'com.google.guava:guava',
            'com.google.code.gson:gson',

            'org.apache.commons:commons-lang3',

            'com.jayway.jsonpath:json-path',

            'io.swagger.core.v3:swagger-annotations-jakarta',

            'com.squareup.retrofit2:converter-gson',

            'org.springdoc:springdoc-openapi-starter-webmvc-ui',
            'org.mapstruct:mapstruct',

            'io.github.resilience4j:resilience4j-spring-boot3',
            )
    compileOnly 'org.osgi:osgi.core:8.0.0'
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    implementation ('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'org.hibernate'
    }
    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa') {
        exclude group: 'org.eclipse.persistence', module: 'jakarta.persistence'
    }
}
