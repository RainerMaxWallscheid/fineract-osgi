dependencies {
    // Fragment main sources (fixtures) compile against api contracts + Spring used by samples.
    implementation(
            project(path: ':fineract-command-api'),
            )

    implementation(
            'org.springframework.boot:spring-boot-starter',
            'org.springframework.boot:spring-boot-starter-data-jdbc',
            'org.springframework.boot:spring-boot-starter-web',
            'org.springframework.boot:spring-boot-starter-validation',
            'io.github.resilience4j:resilience4j-spring-boot3',

            'com.fasterxml.jackson.core:jackson-databind',

            'org.liquibase:liquibase-core',

            'com.mysql:mysql-connector-j',
            'org.postgresql:postgresql',
            'org.mariadb.jdbc:mariadb-java-client',

            'org.apache.commons:commons-lang3',

            'org.mapstruct:mapstruct',
            )
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
    implementation ('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'com.jayway.jsonpath', module: 'json-path'
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        exclude group: 'jakarta.activation'
        exclude group: 'javax.activation'
        exclude group: 'org.skyscreamer'
    }
    implementation (
            'org.mockito:mockito-inline',
            'org.testcontainers:junit-jupiter',
            'org.testcontainers:postgresql',
            'org.testcontainers:mariadb',
            'org.testcontainers:mysql',
            )
    annotationProcessor 'org.mapstruct:mapstruct-processor'

    // White-box / Spring Boot tests of the impl host (Gradle classpath).
    // In an OSGi container the same classes attach via Fragment-Host → command.impl.
    testImplementation(project(path: ':fineract-command-impl'))
    testImplementation(project(path: ':fineract-validation'))
    testImplementation ('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'com.jayway.jsonpath', module: 'json-path'
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        exclude group: 'jakarta.activation'
        exclude group: 'javax.activation'
        exclude group: 'org.skyscreamer'
    }
    testImplementation (
            'org.mockito:mockito-inline',
            'org.testcontainers:junit-jupiter',
            'org.springframework.restdocs:spring-restdocs-mockmvc',
            'org.springframework.restdocs:spring-restdocs-webtestclient',
            'org.springframework.restdocs:spring-restdocs-restassured',
            )
}
