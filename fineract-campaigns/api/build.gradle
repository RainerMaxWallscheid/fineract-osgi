description = 'Fineract Campaigns API (provider peel)'

apply plugin: 'java-library'
apply plugin: 'eclipse'
apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Campaigns API',
                'Bundle-SymbolicName': 'org.apache.fineract.campaigns.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Export-Package': 'org.apache.fineract.infrastructure.campaigns.constants,'
                        + 'org.apache.fineract.infrastructure.campaigns.email,'
                        + 'org.apache.fineract.infrastructure.campaigns.email.data,'
                        + 'org.apache.fineract.infrastructure.campaigns.email.exception,'
                        + 'org.apache.fineract.infrastructure.campaigns.email.service,'
                        + 'org.apache.fineract.infrastructure.campaigns.sms.constants,'
                        + 'org.apache.fineract.infrastructure.campaigns.sms.data,'
                        + 'org.apache.fineract.infrastructure.campaigns.sms.data.dto,'
                        + 'org.apache.fineract.infrastructure.campaigns.sms.exception,'
                        + 'org.apache.fineract.infrastructure.campaigns.sms.service',
                'Import-Package': '*',
                'Automatic-Module-Name': 'org.apache.fineract.campaigns.api'
                )
    }
}
