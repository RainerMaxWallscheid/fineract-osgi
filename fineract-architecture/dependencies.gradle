dependencies {
    // Domain modules on the test classpath so ArchUnit can analyze production classes.
    // Prefer testImplementation (not implementation) — this module has no runtime/main role.
    testImplementation project(path: ':fineract-core')
    testImplementation project(path: ':fineract-loan-api')
    testImplementation project(path: ':fineract-loan-impl')
    testImplementation project(path: ':fineract-savings-api')
    testImplementation project(path: ':fineract-savings-impl')
    testImplementation project(path: ':fineract-accounting-api')
    testImplementation project(path: ':fineract-accounting-impl')
    testImplementation project(path: ':fineract-progressive-loan-api')
    testImplementation project(path: ':fineract-progressive-loan-impl')
    testImplementation project(path: ':fineract-working-capital-loan-api')
    testImplementation project(path: ':fineract-working-capital-loan-impl')
    testImplementation project(path: ':fineract-loan-origination-api')
    testImplementation project(path: ':fineract-loan-origination-impl')
    testImplementation project(path: ':fineract-investor-api')
    testImplementation project(path: ':fineract-investor-impl')
    // Charge OSGi Step 7: analyze api + impl (façade no longer required for ArchUnit classpath).
    testImplementation project(path: ':fineract-charge-api')
    testImplementation project(path: ':fineract-charge-impl')
    testImplementation project(path: ':fineract-tax-api')
    testImplementation project(path: ':fineract-tax-impl')
    testImplementation project(path: ':fineract-rates-api')
    testImplementation project(path: ':fineract-rates-impl')
    testImplementation project(path: ':fineract-cob-api')
    testImplementation project(path: ':fineract-cob-impl')
    testImplementation project(path: ':fineract-branch-api')
    testImplementation project(path: ':fineract-branch-impl')

    testImplementation('com.tngtech.archunit:archunit-junit5')
    testImplementation('org.junit.jupiter:junit-jupiter-api')
    testImplementation('org.junit.jupiter:junit-jupiter-engine')
    testImplementation('org.junit.jupiter:junit-jupiter-params')
}
