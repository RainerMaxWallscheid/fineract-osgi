# ArchUnit freeze store for Bounded Context dependency rules.
# Location is relative to the module working directory when tests run.
freeze.store.default.path=src/test/resources/archunit_store
# Allow creating/updating the store when rules are frozen for the first time or
# when violations are deliberately reduced (refreeze after fixing legacy debt).
# Set to false in CI after the baseline is committed if you want to forbid shrink-only updates
# via separate process; default true keeps local developer ergonomics.
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
