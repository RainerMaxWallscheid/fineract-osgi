    implementation project(':fineract-security-impl')
    implementation project(':fineract-useradministration-api')
    implementation project(':fineract-useradministration-impl')
    implementation project(':fineract-adhocquery-api')
    implementation project(':fineract-adhocquery-impl')
    implementation project(':fineract-template-api')
    implementation project(':fineract-template-impl')
    implementation project(':fineract-notification-api')
    implementation project(':fineract-notification-impl')
    implementation project(':fineract-spm-api')
    implementation project(':fineract-spm-impl')
    implementation project(':fineract-fund-api')
    implementation project(':fineract-fund-impl')
    implementation project(':fineract-accountnumberformat-api')
    implementation project(':fineract-accountnumberformat-impl')
    implementation project(':fineract-survey-api')
    implementation project(':fineract-survey-impl')
    implementation project(':fineract-entityaccess-api')
    implementation project(':fineract-entityaccess-impl')
    implementation project(':fineract-calendar-api')
    implementation project(':fineract-calendar-impl')
    implementation project(':fineract-meeting-api')
    implementation project(':fineract-meeting-impl')
    implementation project(':fineract-accounting-api')
