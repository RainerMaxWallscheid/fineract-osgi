dependencies {
    api project(path: ':fineract-jobs-api')
    implementation(project(path: ':fineract-core'))
    implementation(project(path: ':fineract-command-api'))
    implementation(project(path: ':fineract-businessdate-api'))
    implementation(project(path: ':fineract-security-api'))
    implementation(project(path: ':fineract-useradministration-api'))
    implementation(project(path: ':fineract-useradministration-impl'))
    implementation(project(path: ':fineract-cob-api'))
    implementation(project(path: ':fineract-cob-impl'))
    // SpringBatchJobConstants on COB job parameter provider
    implementation(project(path: ':fineract-springbatch-api'))
    implementation(project(path: ':fineract-accounting-api'))
    implementation(project(path: ':fineract-accounting-impl'))
    implementation(project(path: ':fineract-loan-api'))
    implementation(project(path: ':fineract-loan-impl'))
    implementation(project(path: ':fineract-progressive-loan-api'))
    implementation(project(path: ':fineract-progressive-loan-impl'))
    implementation(project(path: ':fineract-working-capital-loan-api'))
    implementation(project(path: ':fineract-working-capital-loan-impl'))
    implementation(project(path: ':fineract-dataqueries-api'))
    implementation(project(path: ':fineract-report'))
    implementation(
            'org.springframework.boot:spring-boot-starter-web',
            'org.springframework.boot:spring-boot-starter-security',
            'org.springframework.boot:spring-boot-starter-validation',
            'org.springframework.boot:spring-boot-starter-batch',
            'org.springframework.batch:spring-batch-integration',
            'org.springframework:spring-context-support',
            'io.github.resilience4j:resilience4j-spring-boot3',
            'jakarta.ws.rs:jakarta.ws.rs-api',
            'org.glassfish.jersey.media:jersey-media-multipart',
            'com.google.guava:guava',
            'com.google.code.gson:gson',
            'org.apache.commons:commons-lang3',
            'org.apache.commons:commons-collections4',
            'com.fasterxml.jackson.core:jackson-databind',
            'org.apache.httpcomponents:httpcore',
            'io.swagger.core.v3:swagger-annotations-jakarta',
            )
    implementation ('org.quartz-scheduler:quartz') {
        exclude group: 'com.zaxxer', module: 'HikariCP-java7'
    }
    implementation ('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'org.hibernate'
    }
    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa') {
        exclude group: 'org.eclipse.persistence', module: 'jakarta.persistence'
    }
    compileOnly 'org.osgi:osgi.core:8.0.0'
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
}
