description = 'Fineract Document Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

compileJava {
    dependsOn ':fineract-avro-schemas:buildJavaSdk'
}

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// OSGi implementation bundle (ADR-022). ContentPipe residual export for provider bulk-import.
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Document Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.document.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Document management & content-store implementation (FS/S3, REST, Spring)',
                'Service-Component': 'OSGI-INF/document-store.xml, OSGI-INF/document-stream.xml',
                'Require-Capability': 'osgi.extender;filter:="(&(osgi.extender=osgi.component)(version>=1.3.0)(!(version>=2.0.0)))"',
                'Import-Package': 'org.apache.fineract.infrastructure.contentstore.moduleapi,'
                        + 'org.apache.fineract.infrastructure.contentstore.service,'
                        + 'org.apache.fineract.infrastructure.contentstore.data,'
                        + 'org.apache.fineract.infrastructure.contentstore.exception,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.service,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.data,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.exception,'
                        + '*',
                // Spring config package only for Boot wiring; no ContentPipe/processor export (use ContentStreamPort).
                'Automatic-Module-Name': 'org.apache.fineract.document.impl'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-document/impl/bin/main")
}
