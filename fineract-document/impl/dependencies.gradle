dependencies {
    api project(path: ':fineract-document-api')

    implementation(project(path: ':fineract-core'))
    // Handlers use command stack; prefer command-api when Step 8 closes command façade residual.
    implementation(project(path: ':fineract-command-api'))

    implementation(
            'org.springframework.boot:spring-boot-starter-web',
            'org.springframework.boot:spring-boot-starter-validation',
            'org.springframework.boot:spring-boot-starter-security',
            'org.springframework.boot:spring-boot-starter-data-jdbc',
            'jakarta.ws.rs:jakarta.ws.rs-api',
            'org.glassfish.jersey.media:jersey-media-multipart',
            'com.fasterxml.jackson.core:jackson-databind',

            'org.apache.commons:commons-lang3',

            'io.swagger.core.v3:swagger-annotations-jakarta',

            'org.mapstruct:mapstruct',

            'io.github.resilience4j:resilience4j-spring-boot3',
            'org.apache.httpcomponents:httpcore',

            'org.apache.tika:tika-core',
            'org.apache.tika:tika-parser-miscoffice-module',
            'org.apache.tika:tika-parser-image-module',
            )
    implementation('org.apache.tika:tika-parser-microsoft-module') {
        exclude group: 'org.apache.poi', module: 'poi-ooxml-full'
    }
    compileOnly 'org.osgi:osgi.core:8.0.0'
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    implementation('org.apache.commons:commons-csv'){}
    implementation ('software.amazon.awssdk:s3') {
    }
    implementation ('software.amazon.awssdk:auth') {
    }
}
