description = 'Fineract Document API (OSGi interface bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

// OSGi interface bundle (ADR-022 / document plan). No Spring / JPA / REST / AWS on api.
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Document API',
                'Bundle-SymbolicName': 'org.apache.fineract.document.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Document & content-store contracts (ports, service interfaces, DTOs, exceptions)',
                'Export-Package': 'org.apache.fineract.infrastructure.contentstore.moduleapi,'
                        + 'org.apache.fineract.infrastructure.contentstore.service,'
                        + 'org.apache.fineract.infrastructure.contentstore.data,'
                        + 'org.apache.fineract.infrastructure.contentstore.exception,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.service,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.data,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.exception,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.api,'
                        + 'org.apache.fineract.infrastructure.documentmanagement.command',
                'Import-Package': '*',
                'Automatic-Module-Name': 'org.apache.fineract.document.api'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-document/api/bin/main")
}
