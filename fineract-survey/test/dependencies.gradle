dependencies {
    testImplementation(project(path: ':fineract-survey-impl'))
    testImplementation(project(path: ':fineract-core'))
    testImplementation(project(path: ':fineract-command-api'))
    testImplementation(project(path: ':fineract-security-api'))
    testImplementation ('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        exclude group: 'jakarta.activation'
        exclude group: 'javax.activation'
        exclude group: 'org.skyscreamer'
    }
    testImplementation ('org.mockito:mockito-inline')
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'org.springframework.security:spring-security-core'
    // Woven AppUser residual from core needs EclipseLink weaving interfaces
    testImplementation 'jakarta.persistence:jakarta.persistence-api'
    testImplementation 'org.eclipse.persistence:org.eclipse.persistence.jpa'
    testImplementation 'org.springframework.data:spring-data-jpa'
}
