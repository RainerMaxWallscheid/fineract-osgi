description = 'Fineract Organisation API (core slice)'

apply plugin: 'java-library'
apply plugin: 'eclipse'
apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Organisation API',
                'Bundle-SymbolicName': 'org.apache.fineract.organisation.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Export-Package': 'org.apache.fineract.organisation.office.service,'
                        + 'org.apache.fineract.organisation.staff.service,'
                        + 'org.apache.fineract.organisation.holiday.data,'
                        + 'org.apache.fineract.organisation.holiday.service,'
                        + 'org.apache.fineract.organisation.workingdays.data,'
                        + 'org.apache.fineract.organisation.workingdays.service,'
                        + 'org.apache.fineract.organisation.provisioning.data,'
                        + 'org.apache.fineract.organisation.provisioning.exception,'
                        + 'org.apache.fineract.organisation.provisioning.service',
                'Import-Package': 'org.apache.fineract.infrastructure.core.api,'
                        + 'org.apache.fineract.infrastructure.core.data,'
                        + 'org.apache.fineract.infrastructure.core.exception,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.organisation.api'
                )
    }
}
