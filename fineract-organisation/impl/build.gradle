description = 'Fineract Organisation Implementation (core slice)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

compileJava {
    dependsOn ':fineract-organisation-api:jar'
}

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Organisation Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.organisation.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Export-Package': 'org.apache.fineract.organisation.impl.osgi,'
                        + 'org.apache.fineract.organisation.office.api,'
                        + 'org.apache.fineract.organisation.office.domain,'
                        + 'org.apache.fineract.organisation.office.exception,'
                        + 'org.apache.fineract.organisation.office.handler,'
                        + 'org.apache.fineract.organisation.office.mapper,'
                        + 'org.apache.fineract.organisation.office.serialization,'
                        + 'org.apache.fineract.organisation.office.service,'
                        + 'org.apache.fineract.organisation.office.starter,'
                        + 'org.apache.fineract.organisation.staff.adapter,'
                        + 'org.apache.fineract.organisation.staff.api,'
                        + 'org.apache.fineract.organisation.staff.command,'
                        + 'org.apache.fineract.organisation.staff.data,'
                        + 'org.apache.fineract.organisation.staff.domain,'
                        + 'org.apache.fineract.organisation.staff.exception,'
                        + 'org.apache.fineract.organisation.staff.handler,'
                        + 'org.apache.fineract.organisation.staff.mapper,'
                        + 'org.apache.fineract.organisation.staff.service,'
                        + 'org.apache.fineract.organisation.staff.starter,'
                        + 'org.apache.fineract.organisation.staff.validation,'
                        + 'org.apache.fineract.organisation.holiday.api,'
                        + 'org.apache.fineract.organisation.holiday.data,'
                        + 'org.apache.fineract.organisation.holiday.domain,'
                        + 'org.apache.fineract.organisation.holiday.exception,'
                        + 'org.apache.fineract.organisation.holiday.handler,'
                        + 'org.apache.fineract.organisation.holiday.service,'
                        + 'org.apache.fineract.organisation.holiday.starter,'
                        + 'org.apache.fineract.organisation.workingdays.api,'
                        + 'org.apache.fineract.organisation.workingdays.command,'
                        + 'org.apache.fineract.organisation.workingdays.data,'
                        + 'org.apache.fineract.organisation.workingdays.domain,'
                        + 'org.apache.fineract.organisation.workingdays.exception,'
                        + 'org.apache.fineract.organisation.workingdays.handler,'
                        + 'org.apache.fineract.organisation.workingdays.service,'
                        + 'org.apache.fineract.organisation.workingdays.starter',
                'Import-Package': '*',
                'Automatic-Module-Name': 'org.apache.fineract.organisation.impl'
                )
    }
}
