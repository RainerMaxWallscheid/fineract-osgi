# Equinox configuration template for fineract-osgi.
# start-equinox.sh uses -configuration osgi/config (a directory).
# :osgiStageBundles copies this file to osgi/config/config.ini and appends osgi.bundles.
osgi.noShutdown=true
osgi.console.enable.builtin=true
osgi.bundles.defaultStartLevel=4
osgi.startLevel=6
osgi.clean=true
osgi.framework.extensions=
osgi.framework.shape=jar
osgi.install.area=equinox
osgi.logfile=logs/equinox.log

# Fineract specific properties
fineract.mode.read.enabled=true
fineract.mode.write.enabled=true
fineract.mode.batch.manager.enabled=true

# osgi.bundles is generated by :osgiStageBundles, for example:
# osgi.bundles=reference:file:bundles/fineract-core-....jar@2:start,reference:file:bundles/fineract-charge-api-....jar@3:start
