description = 'Fineract Branch Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

compileJava {
    dependsOn ':fineract-avro-schemas:buildJavaSdk'
}

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// OSGi implementation bundle (ADR-022). Export starter only (no residual domain/validator leak).
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Branch Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.branch.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Branch/teller implementation (JPA, REST, handlers, Spring)',
                'Import-Package': 'org.apache.fineract.organisation.teller.moduleapi,'
                        + 'org.apache.fineract.organisation.teller.service,'
                        + 'org.apache.fineract.organisation.teller.data,'
                        + 'org.apache.fineract.organisation.teller.exception,'
                        + '*',
                'Export-Package': 'org.apache.fineract.organisation.teller.starter',
                'Automatic-Module-Name': 'org.apache.fineract.branch.impl'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-branch/impl/bin/main")
}

eclipse {
    project {
        buildCommand([ LaunchConfigHandle: "<project>/.externalToolBuilders/OpenJPA Enhance Builder.launch" ],  'org.eclipse.ui.externaltools.ExternalToolBuilder')
    }
}
