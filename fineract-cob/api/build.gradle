description = 'Fineract COB API (OSGi interface bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract COB API',
                'Bundle-SymbolicName': 'org.apache.fineract.cob.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'COB contracts (ports, pure DTOs, exceptions)',
                'Export-Package': 'org.apache.fineract.cob.data,'
                        + 'org.apache.fineract.cob.domain,'
                        + 'org.apache.fineract.cob.exceptions,'
                        + 'org.apache.fineract.cob.loan,'
                        + 'org.apache.fineract.cob.service',
                'Import-Package': 'org.apache.fineract.infrastructure.core.api,'
                        + 'org.apache.fineract.infrastructure.core.data,'
                        + 'org.apache.fineract.infrastructure.core.domain,'
                        + 'org.apache.fineract.infrastructure.core.exception,'
                        + 'org.apache.fineract.infrastructure.event.business.domain,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.cob.api'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-cob/api/bin/main")
}
