dependencies {
    api project(path: ':fineract-bulkimport-api')
    implementation(project(path: ':fineract-core'))
    // Generic products REST ports (share product read facade)
    implementation(project(path: ':fineract-products-api'))
    // Client pure ports/DTOs (entity residual stays in core)
    implementation(project(path: ':fineract-clients-api'))
    // Group/center ports and pure service types
    implementation(project(path: ':fineract-group-api'))
    // Share product/account ports and pure DTOs
    implementation(project(path: ':fineract-shares-api'))
    implementation(project(path: ':fineract-command-api'))
    implementation(project(path: ':fineract-security-impl'))
    implementation(project(path: ':fineract-document-api'))
    implementation(project(path: ':fineract-document-impl'))
    implementation(project(path: ':fineract-organisation-api'))
    implementation(project(path: ':fineract-organisation-impl'))
    implementation(project(path: ':fineract-codes-api'))
    implementation(project(path: ':fineract-codes-impl'))
    implementation(project(path: ':fineract-monetary-api'))
    implementation(project(path: ':fineract-charge-api'))
    implementation(project(path: ':fineract-charge-impl'))
    implementation(project(path: ':fineract-loan-api'))
    implementation(project(path: ':fineract-loan-impl'))
    implementation(project(path: ':fineract-savings-api'))
    implementation(project(path: ':fineract-savings-impl'))
    implementation(project(path: ':fineract-accounting-api'))
    implementation(project(path: ':fineract-accounting-impl'))
    implementation(project(path: ':fineract-calendar-api'))
    implementation(project(path: ':fineract-calendar-impl'))
    implementation(project(path: ':fineract-address-api'))
    implementation(project(path: ':fineract-address-impl'))
    implementation(project(path: ':fineract-useradministration-api'))
    implementation(project(path: ':fineract-useradministration-impl'))
    implementation(project(path: ':fineract-collateralmanagement-api'))
    implementation(project(path: ':fineract-collateralmanagement-impl'))
    implementation(project(path: ':fineract-fund-api'))
    implementation(project(path: ':fineract-fund-impl'))

    implementation(
            'org.springframework.boot:spring-boot-starter-web',
            'org.springframework.boot:spring-boot-starter-security',
            'org.springframework.boot:spring-boot-starter-validation',
            'org.springframework.boot:spring-boot-starter-cache',
            'jakarta.ws.rs:jakarta.ws.rs-api',
            'org.glassfish.jersey.media:jersey-media-multipart',
            'com.google.guava:guava',
            'com.google.code.gson:gson',
            'org.apache.commons:commons-lang3',
            'io.swagger.core.v3:swagger-annotations-jakarta',
            'org.apache.poi:poi',
            'org.apache.poi:poi-ooxml',
            'org.apache.tika:tika-core',
            )
    implementation ('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'org.hibernate'
    }
    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa') {
        exclude group: 'org.eclipse.persistence', module: 'jakarta.persistence'
    }
    implementation 'org.mapstruct:mapstruct'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    compileOnly 'org.osgi:osgi.core:8.0.0'
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
}
