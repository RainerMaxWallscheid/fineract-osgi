description = 'Fineract Command - Shared integration-test fixtures (all command modules)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

configurations {
    asciidoctorExtensions
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// Test-support library (not a production bundle). Install only on test classpaths.
// Not a Fragment-Host of command.impl — shared by all command-family modules.
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Command Integration Test Support',
                'Bundle-SymbolicName': 'org.apache.fineract.command.integrationtest',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Export-Package': 'org.apache.fineract.command.test,org.apache.fineract.command.test.sample,org.apache.fineract.command.test.sample.api,org.apache.fineract.command.test.sample.command,org.apache.fineract.command.test.sample.data,org.apache.fineract.command.test.sample.exception,org.apache.fineract.command.test.sample.handler,org.apache.fineract.command.test.sample.service',
                'Import-Package': 'org.apache.fineract.command.core,org.apache.fineract.command.core.exception,*',
                'Automatic-Module-Name': 'org.apache.fineract.command.integrationtest'
                )
    }
}

modernizer {
    ignoreClassNamePatterns = [
        '.*AbstractPersistableCustom',
        '.*EntityTables',
        '.*domain.*'
    ]
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-command-integrationtest/bin/main")
}

// No unit tests in this module — it only publishes fixtures for other modules' tests.
tasks.named('test').configure {
    enabled = false
}
