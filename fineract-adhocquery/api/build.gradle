description = 'Fineract AdHoc Query API (provider peel)'

apply plugin: 'java-library'
apply plugin: 'eclipse'
apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract AdHoc Query API',
                'Bundle-SymbolicName': 'org.apache.fineract.adhocquery.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Export-Package': 'org.apache.fineract.adhocquery.api,'
                        + 'org.apache.fineract.adhocquery.data,'
                        + 'org.apache.fineract.adhocquery.domain,'
                        + 'org.apache.fineract.adhocquery.exception,'
                        + 'org.apache.fineract.adhocquery.service',
                'Import-Package': 'org.apache.fineract.infrastructure.core.api,'
                        + 'org.apache.fineract.infrastructure.core.data,'
                        + 'org.apache.fineract.infrastructure.core.exception,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.adhocquery.api'
                )
    }
}
