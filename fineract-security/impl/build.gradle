description = 'Fineract Security Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

compileJava {
    dependsOn ':fineract-security-api:jar'
    options.compilerArgs += ['-parameters']
}

configurations {
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Security Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.security.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Security implementation residual',
                'Import-Package': '*',
                'Export-Package': 'org.apache.fineract.infrastructure.security,'
                        + 'org.apache.fineract.infrastructure.security.api,'
                        + 'org.apache.fineract.infrastructure.security.command,'
                        + 'org.apache.fineract.infrastructure.security.converter,'
                        + 'org.apache.fineract.infrastructure.security.data,'
                        + 'org.apache.fineract.infrastructure.security.domain,'
                        + 'org.apache.fineract.infrastructure.security.exception,'
                        + 'org.apache.fineract.infrastructure.security.filter,'
                        + 'org.apache.fineract.infrastructure.security.handler,'
                        + 'org.apache.fineract.infrastructure.security.impl.osgi,'
                        + 'org.apache.fineract.infrastructure.security.service',
                'Automatic-Module-Name': 'org.apache.fineract.security.impl'
                )
    }
}

modernizer {
    ignoreClassNamePatterns = [
        '.*AbstractPersistableCustom',
        '.*EntityTables',
        '.*domain.*'
    ]
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-security/impl/bin/main")
}
