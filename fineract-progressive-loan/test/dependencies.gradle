dependencies {
    testImplementation(project(path: ':fineract-progressive-loan-impl'))
    testImplementation(project(path: ':fineract-core'))
    testImplementation(project(path: ':fineract-bulkimport-api'))
    testImplementation(project(path: ':fineract-businessdate-api'))
    testImplementation(project(path: ':fineract-loan-api'))
    testImplementation(project(path: ':fineract-loan-impl'))
    testImplementation(project(path: ':fineract-savings-impl'))
    // Leftover test compile after peels (PaymentDetailWritePlatformService, account-transfer ports)
    testImplementation(project(path: ':fineract-paymentdetail-api'))
    testImplementation(project(path: ':fineract-accounttransfer-api'))
    // ClientReadPlatformService / ClientMapper / GroupReadPlatformService
    testImplementation(project(path: ':fineract-clients-api'))
    testImplementation(project(path: ':fineract-clients-impl'))
    testImplementation(project(path: ':fineract-group-api'))
    testImplementation(project(path: ':fineract-accounting-api'))
    testImplementation(project(path: ':fineract-charge-api'))
    testImplementation(project(path: ':fineract-charge-impl'))
    testImplementation(project(path: ':fineract-dataqueries-impl'))
    testImplementation(project(path: ':fineract-note-api'))
    testImplementation(project(path: ':fineract-collateralmanagement-impl'))
    testImplementation(project(path: ':fineract-working-capital-loan-impl'))
    testImplementation(project(path: ':fineract-fund-api'))
    testImplementation(project(path: ':fineract-cob-api'))
    testImplementation(project(path: ':fineract-cob-impl'))
    testImplementation(project(path: ':fineract-calendar-impl'))
    testImplementation(project(path: ':fineract-organisation-api'))
    testImplementation(project(path: ':fineract-branch-api'))
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'org.springframework.security:spring-security-core'
    testCompileOnly 'com.github.spotbugs:spotbugs-annotations'
    testImplementation( 'io.github.classgraph:classgraph' )
    testImplementation 'com.google.code.gson:gson'
    testImplementation 'com.google.guava:guava'
    testImplementation 'org.apache.commons:commons-lang3'
    testImplementation 'jakarta.ws.rs:jakarta.ws.rs-api'
    testImplementation 'org.apache.httpcomponents:httpcore'
    testImplementation 'com.fasterxml.jackson.core:jackson-core'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation ('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'org.hibernate'
    }
    testImplementation('org.eclipse.persistence:org.eclipse.persistence.jpa') {
        exclude group: 'org.eclipse.persistence', module: 'jakarta.persistence'
    }
    testImplementation ('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'com.jayway.jsonpath', module: 'json-path'
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        exclude group: 'jakarta.activation'
        exclude group: 'javax.activation'
        exclude group: 'org.skyscreamer'
    }
    testImplementation ('org.mockito:mockito-inline')
}
