dependencies {
    // Equinox OSGi Framework
    implementation 'org.eclipse.platform:org.eclipse.osgi:3.20.0'   // aktuelle Version prüfen
    
    // OSGi Core APIs
    implementation 'org.osgi:org.osgi.core:8.0.0'
    implementation 'org.osgi:org.osgi.service.component:1.5.1'
    implementation 'org.osgi:org.osgi.service.scr:1.5.0'
}

// Task zum Starten von Equinox
task equinoxStart(type: JavaExec) {
    classpath = configurations.runtimeClasspath
    mainClass = 'org.eclipse.osgi.launch.Equinox'
    args = ['-console', '-clean']
    workingDir = file('osgi/equinox')
}
