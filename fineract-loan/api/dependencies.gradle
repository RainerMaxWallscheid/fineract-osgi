dependencies {
    // Shared kernel: LoanStatus, monetary, core DTOs, ExternalId, …
    api project(path: ':fineract-core')
    // ChargeData / charge catalog on pure loan charge DTOs
    api project(path: ':fineract-charge-api')
    // Accounting DTOs used by pure product/account bridge data
    api project(path: ':fineract-accounting-api')
    // Loan originator pure DTO on application ports
    api project(path: ':fineract-loan-origination-api')
    // Floating rate DTOs on pure product data slices
    api project(path: ':fineract-rates-api')
    // Tax identifiers on pure charge tax DTOs
    api project(path: ':fineract-tax-api')
    // Deposit on-hold DTO on guarantor funding transaction data
    api project(path: ':fineract-savings-api')
    // Re-age / re-amortize preview request constraints
    api project(path: ':fineract-validation')

    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.google.code.gson:gson'
    implementation 'com.google.guava:guava'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    implementation 'jakarta.validation:jakarta.validation-api'
    compileOnly 'jakarta.annotation:jakarta.annotation-api'
    compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api'
    // LoanChargePaidByData uses @Default
    compileOnly 'org.springframework.integration:spring-integration-core'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
}
