dependencies {
    api project(path: ':fineract-event-api')
    implementation(project(path: ':fineract-core'))
    // Generic products REST ports (share product read facade)
    implementation(project(path: ':fineract-products-api'))
    // Client pure ports/DTOs (entity residual stays in core)
    implementation(project(path: ':fineract-clients-api'))
    // Share product/account ports and pure DTOs
    implementation(project(path: ':fineract-shares-api'))
    implementation(project(path: ':fineract-avro-schemas'))
    implementation(project(path: ':fineract-document-api'))
    implementation(project(path: ':fineract-loan-api'))
    implementation(project(path: ':fineract-savings-api'))
    implementation(project(path: ':fineract-cob-api'))
    implementation(project(path: ':fineract-working-capital-loan-api'))
    implementation(project(path: ':fineract-monetary-api'))
    // External event config API uses CommandDispatcher / CommandHandler
    implementation(project(path: ':fineract-command-api'))

    implementation(
            'org.springframework.boot:spring-boot-starter',
            'org.springframework.boot:spring-boot-starter-batch',
            'org.springframework.kafka:spring-kafka',
            'org.springframework:spring-jms',
            'org.springframework.boot:spring-boot-starter-integration',
            'org.springframework.integration:spring-integration-jms',
            'org.springframework.integration:spring-integration-kafka',
            'jakarta.jms:jakarta.jms-api',
            'org.apache.avro:avro',
            'org.mapstruct:mapstruct',
            'com.google.guava:guava',
            'org.apache.commons:commons-collections4',
            'org.apache.commons:commons-lang3',
            'io.github.classgraph:classgraph',
            'jakarta.ws.rs:jakarta.ws.rs-api',
            'io.swagger.core.v3:swagger-annotations-jakarta',
            'com.fasterxml.jackson.core:jackson-databind',
            'jakarta.validation:jakarta.validation-api',
            'io.github.resilience4j:resilience4j-spring-boot3',
            )
    implementation ('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'org.hibernate'
    }
    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa') {
        exclude group: 'org.eclipse.persistence', module: 'jakarta.persistence'
    }
    implementation ('org.apache.activemq:activemq-client') {
    }
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
}
