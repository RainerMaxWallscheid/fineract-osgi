description = 'Fineract Command Implementation (OSGi impl bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

configurations {
    asciidoctorExtensions
    providedRuntime
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// OSGi implementation bundle: do not export internals to foreign domain modules
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Command Implementation',
                'Bundle-SymbolicName': 'org.apache.fineract.command.impl',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Import-Package': 'org.apache.fineract.command.core,org.apache.fineract.command.core.exception,*',
                'Export-Package': 'org.apache.fineract.command.impl.config,'
                        + 'org.apache.fineract.command.starter,'
                        + 'org.apache.fineract.commands.api,'
                        + 'org.apache.fineract.commands.data,'
                        + 'org.apache.fineract.commands.data.request,'
                        + 'org.apache.fineract.commands.service,'
                        + 'org.apache.fineract.commands.starter',
                'Automatic-Module-Name': 'org.apache.fineract.command.impl'
                )
    }
}

modernizer {
    ignoreClassNamePatterns = [
        '.*AbstractPersistableCustom',
        '.*EntityTables',
        '.*domain.*'
    ]
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-command/impl/bin/main")
}

// Production-only module: white-box tests live in :fineract-command-test (Fragment-Host).
// Shared IT fixtures: :fineract-command-integrationtest.
