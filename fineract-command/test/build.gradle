description = 'Fineract Command - Test fragment (host: command.impl)'

apply plugin: 'java'
apply plugin: 'eclipse'

configurations {
    asciidoctorExtensions
    providedRuntime // needed for Spring Boot executable WAR
    providedCompile
    compile() {
        exclude module: 'hibernate-entitymanager'
        exclude module: 'hibernate-validator'
        exclude module: 'activation'
        exclude module: 'bcmail-jdk14'
        exclude module: 'bcprov-jdk14'
        exclude module: 'bctsp-jdk14'
        exclude module: 'c3p0'
        exclude module: 'stax-api'
        exclude module: 'jaxb-api'
        exclude module: 'jaxb-impl'
        exclude module: 'jboss-logging'
        exclude module: 'itext-rtf'
        exclude module: 'classworlds'
    }
    runtime
}

apply from: 'dependencies.gradle'

// OSGi fragment attached to command-impl (ADR-022).
// main = shared fixtures/samples for the host class space
// test = JUnit/Spring Boot white-box tests of the host (Gradle); same fragment jar for Equinox install later
jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Command Test Fragment',
                'Bundle-SymbolicName': 'org.apache.fineract.command.test',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Fragment-Host': 'org.apache.fineract.command.impl',
                'Automatic-Module-Name': 'org.apache.fineract.command.test'
                )
    }
}

// Configuration for the modernizer plugin
// https://github.com/andygoossens/gradle-modernizer-plugin
modernizer {
    ignoreClassNamePatterns = [
        '.*AbstractPersistableCustom',
        '.*EntityTables',
        '.*domain.*'
    ]
}

// If we are running Gradle within Eclipse to enhance classes with OpenJPA,
// set the classes directory to point to Eclipse's default build directory
if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-command/test/bin/main")
    sourceSets.test.java.outputDir = new File(rootProject.projectDir, "fineract-command/test/bin/test")
}

if (!(project.hasProperty('env') && project.getProperty('env') == 'dev')) {
    sourceSets {
        test {
            java {
                exclude '**/core/boot/tests/**'
            }
        }
    }
}

tasks.named('test').configure {
    useJUnitPlatform()
}
