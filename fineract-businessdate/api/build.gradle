description = 'Fineract Business Date API (core slice — OSGi interface bundle)'

apply plugin: 'java-library'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Business Date API',
                'Bundle-SymbolicName': 'org.apache.fineract.businessdate.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Business date application ports, DTOs, exceptions (kernel enum stays in core)',
                'Export-Package': 'org.apache.fineract.infrastructure.businessdate.command,'
                        + 'org.apache.fineract.infrastructure.businessdate.data.api,'
                        + 'org.apache.fineract.infrastructure.businessdate.data.service,'
                        + 'org.apache.fineract.infrastructure.businessdate.exception,'
                        + 'org.apache.fineract.infrastructure.businessdate.service',
                'Import-Package': 'org.apache.fineract.command.core,'
                        + 'org.apache.fineract.infrastructure.businessdate.domain,'
                        + 'org.apache.fineract.infrastructure.core.exception,'
                        + 'org.apache.fineract.infrastructure.core.jersey.serializer.legacy,'
                        + 'org.apache.fineract.infrastructure.jobs.exception,'
                        + '*',
                'Automatic-Module-Name': 'org.apache.fineract.businessdate.api'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.main.java.outputDir = new File(rootProject.projectDir, "fineract-businessdate/api/bin/main")
}
