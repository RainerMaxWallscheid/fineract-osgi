dependencies {
    // Kernel: BusinessDateType, AbstractPlatform* exceptions, Jersey date format, jobs exception.
    // No reverse dependency: core keeps BusinessDateType only (avoids Gradle cycle).
    api project(path: ':fineract-core')
    api project(path: ':fineract-validation')
    // Command envelope on BusinessDateUpdateCommand
    api project(path: ':fineract-command-api')

    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.google.code.gson:gson'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta'
    compileOnly 'com.github.spotbugs:spotbugs-annotations'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'jakarta.validation:jakarta.validation-api'
}
