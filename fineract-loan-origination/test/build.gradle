description = 'Fineract Loan Origination - Unit/white-box test fragment (host: loanorigination.impl)'

apply plugin: 'java'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

jar {
    from sourceSets.test.output
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Loan Origination Test Fragment',
                'Bundle-SymbolicName': 'org.apache.fineract.loanorigination.test',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'White-box unit tests for loan-origination-impl (Fragment-Host)',
                'Fragment-Host': 'org.apache.fineract.loanorigination.impl',
                'Automatic-Module-Name': 'org.apache.fineract.loanorigination.test'
                )
    }
}

if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
    sourceSets.test.java.outputDir = new File(rootProject.projectDir, "fineract-loan-origination/test/bin/test")
}

tasks.named('test').configure {
    useJUnitPlatform()
}

tasks.named('jar').configure {
    dependsOn tasks.named('testClasses')
}
