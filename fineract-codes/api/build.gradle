description = 'Fineract Codes API (core slice — pure catalog contracts)'

apply plugin: 'java-library'
apply plugin: 'eclipse'
apply from: 'dependencies.gradle'

jar {
    manifest {
        attributes(
                'Bundle-ManifestVersion': '2',
                'Bundle-Name': 'Apache Fineract Codes API',
                'Bundle-SymbolicName': 'org.apache.fineract.codes.api',
                'Bundle-Version': "${project.version}".replace('-SNAPSHOT', '.SNAPSHOT'),
                'Bundle-Description': 'Code/code-value catalog ports and DTOs (entities residual in core)',
                'Export-Package': 'org.apache.fineract.infrastructure.codes,'
                        + 'org.apache.fineract.infrastructure.codes.api,'
                        + 'org.apache.fineract.infrastructure.codes.data,'
                        + 'org.apache.fineract.infrastructure.codes.service',
                'Automatic-Module-Name': 'org.apache.fineract.codes.api'
                )
    }
}
