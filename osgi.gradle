// Equinox scaffold tasks. Applied from the root build. See osgi/README.md.

tasks.register('checkForeignImplDeps', Exec) {
    group = 'verification'
    description = 'Fail on new domain *-impl dependencies on a foreign *-impl (ADR-022 B4)'
    workingDir = rootDir
    commandLine 'python3', 'osgi/check-foreign-impl-deps.py'
}

tasks.register('checkArchUnitFreeze', Exec) {
    group = 'verification'
    description = 'Fail when the ArchUnit freeze store grows or the B5 budget is stale'
    workingDir = rootDir
    commandLine 'python3', 'osgi/check-archunit-freeze.py'
}

tasks.register('checkOsgiManifests', Exec) {
    group = 'verification'
    description = 'Fail on duplicate BSN, missing Fragment-Host, impl Export-Package, a new Bundle-Activator, a missing DS descriptor, split packages, a stale core export list, or incomplete api Import-Package'
    dependsOn checkForeignImplDeps
    dependsOn checkArchUnitFreeze
    workingDir = rootDir
    commandLine 'python3', 'osgi/check-manifests.py'
}

def osgiStageProjects = {
    rootProject.subprojects.findAll { p ->
        p.name == 'fineract-core' || p.name.endsWith('-api') || p.name.endsWith('-impl')
    }.sort { it.path }
}

tasks.register('osgiStageBundles') {
    group = 'distribution'
    description = 'Copy api/impl/core jars to osgi/bundles and write osgi/config/config.ini'
    dependsOn checkOsgiManifests
    dependsOn {
        osgiStageProjects().collect { p -> p.tasks.named('jar') }
    }
    doLast {
        def dest = file('osgi/bundles')
        dest.mkdirs()
        dest.eachFile { f ->
            if (f.name.endsWith('.jar')) {
                f.delete()
            }
        }
        def entries = []
        // ADR-022 B6: Felix SCR + OSGi DS API at start level 1 (not copied to bundles/).
        def dsProc = new ByteArrayOutputStream()
        exec {
            commandLine 'python3', 'osgi/ensure-ds-runtime.py'
            standardOutput = dsProc
        }
        dsProc.toString().trim().split('\n').each { line ->
            def jar = file(line.trim())
            if (jar.name.endsWith('.jar') && jar.exists()) {
                entries << "reference:file:${jar.absolutePath}@1:start"
            }
        }
        osgiStageProjects().each { p ->
            def jarTask = p.tasks.named('jar').get()
            def jar = jarTask.archiveFile.get().asFile
            if (!jar.exists()) {
                throw new GradleException("Missing jar for ${p.path}: ${jar}")
            }
            copy {
                from jar
                into dest
            }
            def startLevel = 4
            if (p.name == 'fineract-core') {
                startLevel = 2
            } else if (p.name.endsWith('-api')) {
                startLevel = 3
            }
            // Absolute file: URLs to the staged copy. Relative paths resolve
            // against osgi.install.area (osgi/equinox), not the working dir.
            def staged = new File(dest, jar.name)
            entries << "reference:file:${staged.absolutePath}@${startLevel}:start"
        }
        def template = file('osgi/equinox/config.ini')
        def configDir = file('osgi/config')
        configDir.mkdirs()
        def body = template.exists() ? template.getText('UTF-8') : ''
        if (!body.endsWith('\n')) {
            body += '\n'
        }
        body += '\n# Generated by :osgiStageBundles — do not edit osgi/config/config.ini.\n'
        body += 'osgi.bundles=' + entries.join(',') + '\n'
        file('osgi/config/config.ini').write(body, 'UTF-8')
        logger.lifecycle("Staged ${entries.size()} jars into ${dest} and wrote osgi/config/config.ini")
    }
}

tasks.register('equinoxStart', Exec) {
    group = 'application'
    description = 'Start the Equinox console (osgi/start-equinox.sh)'
    workingDir = rootDir
    commandLine 'bash', 'osgi/start-equinox.sh'
}

tasks.register('equinoxResolveSmoke', Exec) {
    group = 'verification'
    description = 'Stage catalog jars and resolve them in Equinox (no start)'
    dependsOn osgiStageBundles
    workingDir = rootDir
    commandLine 'python3', 'osgi/resolve-smoke.py'
}

tasks.register('equinoxStartSmoke', Exec) {
    group = 'verification'
    description = 'Stage catalog jars, start them in Equinox, and fail if a pilot OSGi service is missing'
    dependsOn osgiStageBundles
    workingDir = rootDir
    commandLine 'python3', 'osgi/resolve-smoke.py', '--start', '--strict'
}

tasks.register('equinoxSpringBridgeSmoke', Exec) {
    group = 'verification'
    description = 'Stage catalog jars, start Equinox, and register a hosted ChargeDefinitionPort from the composition root'
    dependsOn osgiStageBundles
    workingDir = rootDir
    commandLine 'python3', 'osgi/spring-bridge-smoke.py'
}
